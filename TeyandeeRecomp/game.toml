# 16KB bank1 high half = 8KB#3 (R6=3 → CPU $8000 == model $A000)
bank1 = [
    0xA000,  # mode_dispatch
    0xA003,
    0xA01B, 0xA127, 0xA264, 0xA362, 0xA523,
    # Game-loop physics vectors (CPU $9170–$9179) — called after mmc3_map R6=3
    # Playtest MISS: B170/B173/B176/B179. Each is JMP to collision/state handler.
    0xB170, 0xB173, 0xB176, 0xB179,
    0xB1CC, 0xB20C, 0xB259, 0xB7CE, 0xB97F,
    0xB9A3, 0xBA0E, 0xBA5F, 0xBA9D, 0xBAF8, 0xBBE5, 0xBCE5,
