    0xB34D, 0xB373, 0xB41B, 0xBDC8, 0xBC69, 0xBC0C,
    # Collision-type jump table at CPU $918C (model $B18C), indexed by $E4
    # (tile class from LUT $917C). BBE5 → probe $9C69 → JMP $9CD4 → JMP ($14).
    # Missing entries = solid "bonk" without roof-attach / reverse-state handlers.
    # Tile $0D (roof) → E4=8 → $93EA; class 2 → E4=C → $92AC (subpixel attach).
    0xB232, 0xB236, 0xB2AC, 0xB2EB, 0xB2F2, 0xB2F9,
    0xB3EA, 0xB436, 0xB496, 0xB4A0, 0xB4AA, 0xB4E9, 0xB4FB,
