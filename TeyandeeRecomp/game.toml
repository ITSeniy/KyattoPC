# game.toml — Kyatto Ninden Teyandee (Famicom / Japan)
# Mapper 4 (MMC3), 8 × 16KB PRG, 16 × 8KB CHR ROM
#
# Vectors (fixed last bank @ $C000):
#   NMI   = $FCCD
#   RESET = $FF90
#   IRQ   = $FC22  (may JMP $8006 into a switchable bank)
#
# Grow this file as Ghidra RE discovers:
#   - bank-switch trampolines  → [mapper] bank_switch / [[trampoline]]
#   - dispatch tables          → [[known_table]] / [[split_table]]
#   - dynamic-only entries     → [functions] bankN / fixed

[game]
output_prefix = "teyandee"
# NOTE: do NOT enable push_all_jsr globally — it causes NMI/audio C-stack
# recursion (func_FCCD nested dozens deep) and crashes before character select.
# Reverse-gravity PLA PLA JMP is handled in the recompiler (code_generator.c).

# Start with full discovery; tighten later if data-as-code noise appears.
# disable_ptr_scan = true
# disable_secondary = true

# MMC3 bank-switch helpers (RE from bank07 — see docs/boot_re.md)
# $C4FA: X=8KB index → R6=X, R7=X+1 (16KB pair)
# $C513: X=8KB index → R6=X only
[mapper]
bank_switch = [ 0xC4FA, 0xC513 ]

# [[trampoline]]
# addr = 0x????
# inline_bytes = 3
# bs_fn_addr = 0x????

# [[known_table]]
# bank = 0
# start = 0x8000
# end   = 0x8000

# [[data_region]]
# bank = 0
# start = 0x8000
# end   = 0x8000

# Mode pointer table in 8KB#3 (CPU $8011) — lives at $A011 in 16KB bank1 model.
[[known_table]]
bank = 1
start = 0xA011
end = 0xA01B

# Sound-engine: instrument/note table (CPU $8981) and opcode jump table.
[[known_table]]
bank = 5
start = 0xA981
end = 0xA9E1

# Music script opcode handlers (CPU $8500+) — table at model $A4BD (32 × LE16)
[[known_table]]
bank = 5
start = 0xA4BD
end = 0xA4FD

# Scene-script opcode jump table (CPU $8FCA / model $AFCA), 17 LE16 handlers.
# Used by $A392–$A3AE: PHA cont / build ptr / JMP ($00).
[[known_table]]
bank = 3
start = 0xAFCA
end = 0xAFEC

# Low half of bank3 ($8000–$9FFF in the 16KB model) is data / false code.
# False standalone $8F7D used to mega-scan into $A0xx, hit MAX_INSNS, and
# truncate scene_init. Do NOT use merge_range for $A093–$A1C9: mid-scene
# helpers ($A1AD etc.) must stay separate dispatch entries for JSR $81xx.
[[data_region]]
bank = 3
start = 0x8000
end = 0xA000

# Enemy/object type → state-table base (DE74: LDA $AD20,X with R6=4/R7=5).
# Types 0..84 live in $AD20–$ADC9; $ADCA+ is type-0 state data / code.
# Earlier end=$AD60 only covered types 0–31 and missed breakable rocks (40/41).
[[known_table]]
bank = 2
start = 0xAD20
end = 0xADCA

# Type-0 state table includes death at $ADD0 (playtest MISS after kill)
[[known_table]]
bank = 2
start = 0xADCA
end = 0xADD0

# Type-40/41 (breakable rock / prop) state tables → $B8CE / $B8EF
[[known_table]]
bank = 2
start = 0xB8C8
end = 0xB8EE

# Type-71 death variant state table → $ADE7
[[known_table]]
bank = 2
start = 0xADE1
end = 0xADE7

[functions]
# Fixed-bank helpers
fixed = [
    0xC0B1,  # boot_continue
    0xC1C8,  # main game loop head (JMP target)
    0xC2C6, 0xC324, 0xC41E, 0xC46F, 0xC4B4, 0xC4E0,
    0xC4FA, 0xC513, 0xC58A,
    0xCA48, 0xCB48, 0xCC3C, 0xCC8F, 0xCDD1, 0xCFD7,
    0xD18D, 0xD458, 0xD4F6, 0xD572, 0xD644, 0xD8E6,
    0xDAC4, 0xDB33, 0xDCF0, 0xDE74, 0xDEC8, 0xE1AB, 0xE1DD,
    # Object-helper trampoline table $C00F–$C0AE (3-byte JMP abs each).
    # Rock break / death FX call C02D/C01E/C060/C07E/…; missing entries
    # no-op the JSR and leave the shared object walk ($DE74) stuck → freeze.
    0xC00F, 0xC012, 0xC015, 0xC018, 0xC01B, 0xC01E, 0xC021, 0xC024,
    0xC027, 0xC02A, 0xC02D, 0xC030, 0xC033, 0xC036, 0xC039, 0xC03C,
    0xC03F, 0xC042, 0xC045, 0xC048, 0xC04B, 0xC04E, 0xC051, 0xC054,
    0xC057, 0xC05A, 0xC05D, 0xC060, 0xC063, 0xC066, 0xC069, 0xC06C,
    0xC06F, 0xC072, 0xC075, 0xC078, 0xC07B, 0xC07E, 0xC081, 0xC084,
    0xC087, 0xC08A, 0xC08D, 0xC090, 0xC093, 0xC096, 0xC099, 0xC09C,
    0xC09F, 0xC0A2, 0xC0A5, 0xC0A8, 0xC0AB, 0xC0AE,
    # Trampoline destinations used by object AI / FX
    0xC22F,
    0xE214, 0xE286, 0xE31F, 0xE351, 0xE395, 0xE3AD, 0xE3B5, 0xE3DC,
    0xE41E, 0xE427, 0xE430, 0xE44A, 0xE455, 0xE460, 0xE46B, 0xE476,
    0xE485, 0xE49D, 0xE4C2, 0xE4DD, 0xE4FE, 0xE530, 0xE53D, 0xE562,
    0xE587, 0xE595, 0xE5A3, 0xE5AF, 0xE5B8, 0xE5BF, 0xE5D4, 0xE5F8,
    0xE618, 0xE634, 0xE64C, 0xE65A, 0xE66A, 0xE6BC, 0xE6C2, 0xE6CD,
    0xE6D6, 0xE6E1, 0xE6EA, 0xE71C, 0xE72E, 0xE73A, 0xE7A5, 0xE7FD,
    0xFC00, 0xFC9E, 0xFDF9, 0xFE04, 0xFE54, 0xFE5E, 0xFE8D,
]

