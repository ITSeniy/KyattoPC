    0xA0F4, 0xA0F7, 0xA111, 0xA11A, 0xA193, 0xA1AD, 0xA1BE, 0xA1CA, 0xA1EC,
    # Scene engine: init + per-frame script tick + opcode loop re-entry
    0xA339, 0xA37A, 0xA565, 0xA5E5, 0xA870, 0xAB9E,
    # Scene opcode jump-table targets (CPU $8FCA, ops $00–$16)
